
spring.application.name=tienda-libros

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_libros
spring.datasource.username=root
spring.datasource.password=654321

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080

spring.jpa.open-in-view=false

# JWT
# Clave de firma (HS256): minimo 32 caracteres. En produccion usar la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:tienda-libros-clave-secreta-para-jwt-2026-cambiar-en-produccion}
# Duracion del token: 1 hora (en milisegundos)
jwt.expiration-ms=3600000
